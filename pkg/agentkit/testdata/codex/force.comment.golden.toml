model = "gpt-5"

[mcp_servers.teknoir]
command = "tnctl"
args = ["mcp"]
env_vars = ["TEKNOIRBOT_API", "TNCTL_BOT_KEY_FILE", "TEKNOIRBOT_NAMESPACE", "TEKNOIR_DOMAIN", "TNCTL_NAMESPACE", "TNCTL_DOMAIN"]

# Context7: docs lookup, added by hand.
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
