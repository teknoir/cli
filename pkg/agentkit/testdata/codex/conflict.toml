# A codex config that already names another teknoir server.
model = "gpt-5-codex"

[mcp_servers.teknoir]
command = "/opt/other/bin/tnctl"
args = ["mcp", "--verbose"]
startup_timeout_sec = 30

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

[profiles.fast]
model = "gpt-5-codex-mini"
