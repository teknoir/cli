# Codex configuration
model = "gpt-5-codex"  # the default model
approval_policy = "on-request"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env = { GITHUB_TOKEN = "not-a-real-token" }

[profiles.fast]
model = "gpt-5-codex-mini"

[mcp_servers.teknoir]
command = "tnctl"
args = ["mcp"]
