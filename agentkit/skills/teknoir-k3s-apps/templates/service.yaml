# A ClusterIP Service for an app in the apps namespace of a TeknoirBot's computer.
# Replace <app>. Apply it with:
#   kubectl apply -f service.yaml -n apps
#
# Only ClusterIP is allowed in this namespace: a NodePort, a LoadBalancer, an ExternalName or an
# externalIPs entry is refused by the admission policy. Nothing outside the bot's VM can reach
# the app: check it from the council pod with curl -s http://<app>.apps.svc.cluster.local:<port>/
# and give the person that URL to open in the bot's desktop browser.
apiVersion: v1
kind: Service
metadata:
  name: <app>
  namespace: apps
  labels:
    app: <app>
spec:
  type: ClusterIP
  selector:
    app: <app>
  ports:
    - name: http
      port: 80
      targetPort: http
